[project]
name = "bot-consorcios"
version = "0.1.0"
description = "Bot de WhatsApp con IA para Estudio Diego Rufeil (administración de consorcios)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14",
    "anthropic>=1.10.0",
    "apscheduler>=3.10,<4",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.115",
    "google-genai>=2.25.0",
    "greenlet>=3.5.6",
    "itsdangerous>=2.2.0",
    "phonenumbers>=9.0.40",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "rapidfuzz>=3.9",
    "requests>=2.34.2",
    "sqladmin==0.32.0",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8.3",
    "pytest-timeout>=2.4.0",
    "pyyaml>=6.0.3",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "S",   # flake8-bandit (security)
]

[tool.ruff.lint.isort]
# The local alembic/ folder holds migrations; the import is the third-party package.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
# Tests use invented tokens and secrets.
"tests/**" = ["S101", "S105", "S106", "S107"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# A hung test fails instead of blocking the whole run.
timeout = 60
