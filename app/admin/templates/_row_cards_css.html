{# Lists with buttons in each row (Teléfonos, Verificaciones): a table on wide screens, one
   card per row on phones (each cell shows its column name from data-label). #}
<style>
  .rows-table td.row-actions { white-space: nowrap; text-align: right; }
  .rows-table td.row-actions form { display: inline; margin: 0; }
  .list-filters summary { cursor: pointer; }
  @media (max-width: 767.98px) {
    .rows-table thead { display: none; }
    .rows-table, .rows-table tbody, .rows-table tr, .rows-table td { display: block; width: 100%; }
    .rows-table tr { padding: .75rem 1rem; border-bottom: 1px solid var(--tblr-border-color, #e6e7e9); }
    .rows-table.card-table tr td, .rows-table.card-table tr td:first-child,
    .rows-table.card-table tr td:last-child { display: flex; gap: .5rem;
      padding: .15rem 0; border: 0; text-align: left; }
    .rows-table td[data-label]::before { content: attr(data-label); flex: 0 0 6.5rem;
      color: var(--tblr-secondary, #667382); font-size: .8rem; }
    .rows-table.card-table tr td.row-actions { gap: .5rem; padding-top: .5rem; white-space: normal; }
    .rows-table td.row-actions form, .rows-table td.row-actions > a { flex: 1; display: flex; }
    .rows-table td.row-actions .btn { flex: 1; }
  }
</style>
