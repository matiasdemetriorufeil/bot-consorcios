{# The panel's only confirmation: before what cannot be undone. panel.js fills it from the
   form's data-confirm-* attributes (app.admin.help.confirm_attrs) and sends the form only when
   confirmed. Without JavaScript the form is sent as is. #}
<dialog id="confirm-dialog" class="confirm-dialog" aria-labelledby="confirm-title">
  <form method="dialog">
    <h3 id="confirm-title" class="confirm-title"></h3>
    <p id="confirm-text" class="confirm-text"></p>
    <div class="confirm-buttons">
      <button type="submit" value="cancel" class="btn btn-secondary"><i class="fa-solid fa-arrow-left me-1"></i>Volver</button>
      <button type="submit" value="ok" id="confirm-ok" class="btn btn-danger"></button>
    </div>
  </form>
</dialog>
