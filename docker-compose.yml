services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-bot_consorcios}
      TZ: America/Argentina/Cordoba
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-bot_consorcios}
      # Docker Desktop on Windows does not propagate file events to bind mounts.
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./:/app
    depends_on:
      db:
        condition: service_healthy

  # Periodic jobs: nightly sync with ConsorPlus (03:00) and canary (08:00), Córdoba time.
  scheduler:
    build: .
    command: python -m app.scheduler
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-bot_consorcios}
      TZ: America/Argentina/Cordoba
    volumes:
      - ./:/app
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
