services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-bot_consorcios}
      TZ: America/Argentina/Cordoba
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-bot_consorcios}
      # Docker Desktop on Windows does not propagate file events to bind mounts.
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./:/app
      # Attachments received by WhatsApp, served only to panel users.
      - wa_media:/data/wa_media
    depends_on:
      db:
        condition: service_healthy

  # Periodic jobs: nightly sync with ConsorPlus (03:00) and canary (08:00), Córdoba time.
  scheduler:
    build: .
    command: python -m app.scheduler
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-bot_consorcios}
      TZ: America/Argentina/Cordoba
    volumes:
      - ./:/app
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # --- Túnel HTTPS hacia el webhook de WhatsApp (SOLO DESARROLLO) ---
  # Meta must reach /webhooks/whatsapp of our api, but the api also serves the panel (/admin).
  # webhook-proxy (Caddy) forwards ONLY that path (deploy/webhook-proxy/Caddyfile, 404 for the
  # rest) and cloudflared-wa publishes the proxy, never the api. Own profile, never started
  # by default; no published ports and no restart (the quick tunnel URL would change).
  #   docker compose --profile tunnel-wa up -d cloudflared-wa
  #   docker compose --profile tunnel-wa logs cloudflared-wa   (the "trycloudflare.com" line)
  # Step by step: docs/whatsapp.md. Without it (and without a phone), the panel's "Chat de
  # prueba" talks to the bot locally.
  webhook-proxy:
    image: caddy:${CADDY_VERSION:-2.10.2-alpine}
    profiles: ["tunnel-wa"]
    volumes:
      - ./deploy/webhook-proxy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - api
    restart: "no"

  cloudflared-wa:
    image: cloudflare/cloudflared:${CLOUDFLARED_VERSION:-2026.9.2}
    profiles: ["tunnel-wa"]
    command: ["tunnel", "--no-autoupdate", "--url", "http://webhook-proxy:8080"]
    depends_on:
      - webhook-proxy
    restart: "no"

volumes:
  pgdata:
  wa_media:
