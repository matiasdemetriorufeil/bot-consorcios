x-chatwoot-base: &chatwoot-base
  image: chatwoot/chatwoot:${CHATWOOT_VERSION:-v4.18.0}
  profiles: ["chatwoot"]
  # No env_file: our .env has POSTGRES_PASSWORD, SMTP_* etc. that Chatwoot would also read.
  # Everything Chatwoot needs comes from CHATWOOT_* variables in .env.
  environment:
    NODE_ENV: production
    RAILS_ENV: production
    INSTALLATION_ENV: docker
    SECRET_KEY_BASE: ${CHATWOOT_SECRET_KEY_BASE:-}
    FRONTEND_URL: ${CHATWOOT_FRONTEND_URL:-http://localhost:3000}
    DEFAULT_LOCALE: es
    FORCE_SSL: "false"
    ENABLE_ACCOUNT_SIGNUP: "false"
    POSTGRES_HOST: chatwoot-db
    POSTGRES_USERNAME: postgres
    POSTGRES_PASSWORD: ${CHATWOOT_POSTGRES_PASSWORD:-}
    POSTGRES_DATABASE: chatwoot_production
    REDIS_URL: redis://chatwoot-redis:6379
    REDIS_PASSWORD: ${CHATWOOT_REDIS_PASSWORD:-}
    ACTIVE_STORAGE_SERVICE: local
    RAILS_LOG_TO_STDOUT: "true"
    LOG_LEVEL: info
    TZ: America/Argentina/Cordoba
  volumes:
    - chatwoot_storage:/app/storage
  depends_on:
    chatwoot-db:
      condition: service_healthy
    chatwoot-redis:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-bot_consorcios}
      TZ: America/Argentina/Cordoba
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-bot_consorcios}
      # Docker Desktop on Windows does not propagate file events to bind mounts.
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./:/app
    depends_on:
      db:
        condition: service_healthy

  # Periodic jobs: nightly sync with ConsorPlus (03:00) and canary (08:00), Córdoba time.
  scheduler:
    build: .
    command: python -m app.scheduler
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-bot_consorcios}
      TZ: America/Argentina/Cordoba
    volumes:
      - ./:/app
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # --- Chatwoot (panel de operadores) ---
  # Based on the official docker-compose.production.yaml from chatwoot/chatwoot. Own Postgres and
  # Redis, separate from ours. Behind the "chatwoot" profile because it needs ~4 GB of RAM:
  #   docker compose --profile chatwoot up -d   (or COMPOSE_PROFILES=chatwoot in .env)
  # Setup and first admin: docs/chatwoot.md
  chatwoot-rails:
    <<: *chatwoot-base
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s

  chatwoot-sidekiq:
    <<: *chatwoot-base
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]

  chatwoot-db:
    image: pgvector/pgvector:pg16
    profiles: ["chatwoot"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${CHATWOOT_POSTGRES_PASSWORD:-}
      POSTGRES_DB: chatwoot_production
    volumes:
      - chatwoot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chatwoot_production"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  chatwoot-redis:
    image: redis:7-alpine
    profiles: ["chatwoot"]
    command: ["sh", "-c", "redis-server --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${CHATWOOT_REDIS_PASSWORD:-}
    volumes:
      - chatwoot_redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  chatwoot_pgdata:
  chatwoot_redis:
  chatwoot_storage:
