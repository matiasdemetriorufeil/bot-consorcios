# --- Pagos no acreditados / reclamos de deuda --------------------------------------------------

# "Ya pagué": explains accreditation (24-72 h hábiles) and repeats today's balance. Only
# offers a handoff after more than 3 business days, and only hands off on an explicit yes.
- id: pago_hoy_acreditacion
  category: pago_no_acreditado
  phone: ana
  turns: ["Ya pagué hoy las expensas y me sigue apareciendo la deuda"]
  expect:
    debt_message_contains: ["165.060"]
    must_call: [get_debt]
    must_not_call: [handoff_to_human]
    handoff: false
    contains: ["72", "165.060"]

- id: pago_semana_ofrece_derivar
  category: pago_no_acreditado
  phone: ana
  turns: ["Pagué hace una semana y me sigue figurando la deuda"]
  expect:
    debt_message_contains: ["165.060"]
    must_call: [get_debt]
    must_not_call: [handoff_to_human]
    handoff: false
    contains: ["165.060", ["persona del estudio", "alguien del estudio"], ["queres", "preferis", "te parece"]]

- id: pago_no_acreditado
  category: pago_no_acreditado
  phone: ana
  turns:
    - "Pagué la semana pasada y me sigue figurando la deuda"
    - "Sí, pasame con alguien que lo revise"
  expect:
    must_call: [get_debt]
    handoff: true

# A handoff offered for another topic (paying the parking space by card) is not accepted by "pero ya
# pagué hoy": that gets the accreditation explanation and no handoff.
- id: oferta_cochera_ya_pague
  category: pago_no_acreditado
  phone: bruno
  turns:
    - "¿Cuánto debo de la cochera de Torre del Sol?"
    - "¿La cochera la puedo pagar con tarjeta de crédito?"
    - "pero ya pagué hoy"
  expect:
    debt_message_contains: ["12.300"]
    must_call: [get_debt]
    handoff: false
    contains: ["12.300", "72"]

- id: pago_doble_debito
  category: pago_no_acreditado
  phone: carla
  turns: ["Me debitaron dos veces la expensa de septiembre"]
  expect:
    handoff: true

- id: reclamo_monto
  category: pago_no_acreditado
  phone: ana
  # Paying in August is "more than 3 business days": it offers, and hands off on the yes.
  turns: ["¿Cuánto debo?", "Eso está mal, yo agosto lo pagué", "Sí, que lo revisen"]
  expect:
    debt_message_contains: ["165.060"]
    must_call: [get_debt]
    handoff: true
    contains: ["165.060"]

