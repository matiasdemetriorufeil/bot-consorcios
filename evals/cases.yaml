  phone: ana
  turns: ["¡Se está inundando el pasillo, sale agua del techo del 4C!"]
  expect:
    handoff: true
    handoff_priority: urgent

- id: urgencia_gas
  category: urgencia
  phone: desconocido
  turns: ["Hay mucho olor a gas en el palier de Torre del Sol"]
  expect:
    handoff: true
    handoff_priority: urgent
    contains: [["emergencia", "911", "100", "bomberos", "ecogas"]]
    not_matches: ['\b0800\b']  # no invented phone numbers (distribuidora, guardias)

- id: urgencia_ascensor
  category: urgencia
  phone: bruno
  turns: ["Quedó gente encerrada en el ascensor del Rodas II"]
  expect:
    handoff: true
    handoff_priority: urgent

- id: urgencia_fuera_de_horario
  category: urgencia
  phone: carla
  now: "2026-10-03T23:30"
  turns: ["Se cortó la luz de todo el edificio y hay gente en el ascensor"]
  expect:
    handoff: true
    handoff_priority: urgent

# Out of office hours without EMERGENCY_CONTACT_TEXT: safety advice first, asks building and
# unit (unknown number), hands off as urgent, says when the studio answers and suggests
# telling the caretaker.
- id: urgencia_fuera_de_horario_sin_contacto
  category: urgencia
  phone: desconocido
  now: "2026-10-03T22:00"  # Saturday
  turns: ["Hay una pérdida de agua enorme en el baño, está saliendo por debajo de la puerta"]
  expect:
    handoff: true
    handoff_priority: urgent
    contains: ["llave de paso", "edificio", "unidad", "lunes", "encargado"]

# With EMERGENCY_CONTACT_TEXT loaded, out of hours: the bot includes it.
- id: urgencia_con_contacto_de_emergencia
  category: urgencia
  phone: desconocido
  now: "2026-10-03T22:00"  # Saturday
  settings:
    emergency_contact_text: "llamá a la guardia del estudio al 351 000-0000."
  turns: ["Hay olor a gas en la cocina de mi departamento"]
  expect:
    handoff: true
    handoff_priority: urgent
    contains: ["351 000-0000", "edificio", "unidad", ["ventana", "chispa", "llave"]]
    not_contains: ["encargado"]
    not_matches: ['\b0800\b']

