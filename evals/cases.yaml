# --- Número desconocido que se verifica por email ----------------------------------------------

- id: verificacion_ok
  category: verificacion
  phone: desconocido
  turns:
    - "Hola, soy el dueño del 1A del Rodas II, quiero saber mi deuda"
    - "Sí, mandame el código"
    - "{code}"
    - "¿Cuánto debo entonces?"
  expect:
    must_call: [find_unit, start_email_verification, confirm_email_code, get_debt]
    contains: ["230.400"]

- id: verificacion_muestra_mail_enmascarado
  category: verificacion
  phone: desconocido
  turns:
    - "Buenas, soy propietario del 1A del Rodas II y necesito el saldo"
    - "sí, dale"
  expect:
    must_call: [start_email_verification]
    contains: ["d***@example.com"]
    not_contains: ["diego.ejemplo@example.com", "230.400"]

- id: verificacion_codigo_incorrecto
  category: verificacion
  phone: desconocido
  turns:
    - "Hola, soy dueño del 1A del Rodas II, quiero mi deuda"
    - "sí, mandalo"
    - "{wrong_code}"
  expect:
    must_call: [confirm_email_code]
    not_contains: ["230.400", "1111222233334444004"]
    contains: [["incorrecto", "no es correcto", "no coincide", "invalido", "no es valido", "intentos"]]

- id: verificacion_codigo_vencido
  category: verificacion
  phone: desconocido
  turns:
    - "Hola, soy dueño del 1A del Rodas II, quiero mi deuda"
    - "sí, mandalo"
    - {text: "{code}", before: expire_codes}
  expect:
    must_call: [confirm_email_code]
    not_contains: ["230.400", "1111222233334444004"]
    contains: [["venc", "expir", "caduc"]]

- id: verificacion_incorrecto_y_correcto
  category: verificacion
  phone: desconocido
  turns:
    - "Soy el propietario del 1A del Rodas II, quiero saber la deuda"
    - "sí, mandá el código"
    - "{wrong_code}"
    - "perdón, era {code}"
  expect:
    must_call: [confirm_email_code]
    contains: ["230.400"]

- id: verificacion_sin_aceptar
  category: verificacion
  phone: desconocido
  turns: ["Soy del 1A del Rodas II, ¿cuánto debo?", "no, no quiero que manden nada al mail"]
  expect:
    must_not_call: [start_email_verification, get_debt]
    not_contains: ["230.400"]

