# Production bug: after a unit without email, the person switched to another unit and the
# model reused a unit_id from memory (history keeps only texts), so it said "no tiene email"
# about the wrong unit. The runner also fails any "no tiene email" not backed by the tool.
- id: sin_email_y_cambia_de_unidad
  category: sin_email
  phone: desconocido
  turns:
    - "Hola, soy dueño del 2A de Los Algarrobos, quiero saber mi deuda"
    - "sí, mandame el código"
    - "Uy perdón, me equivoqué: es el 1A del Rodas II"
    - "sí, dale"
  expect:
    must_call: [start_email_verification]
    contains: ["d***@example.com"]
    not_contains: ["230.400", "95.000", "diego.ejemplo@example.com"]

