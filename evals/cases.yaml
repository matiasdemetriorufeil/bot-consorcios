- id: sin_respuesta_cbu
  category: sin_respuesta
  phone: bruno
  turns: ["Pasame el CBU del consorcio para transferir"]
  expect:
    # Nothing in the tools says how transfers work: no CBU, and no invented payment rules
    # ("no manejamos transferencias", "no se paga por CBU"...).
    not_contains: ["cbu: ", "alias: "]
    not_matches:
      - '\bno (se )?(manejamos|aceptamos|aceptan|realiz\w*|hace\w*|paga\w*|abona\w*|recib\w*|trabaj\w*)\b[^.\n]{0,40}\b(cbu|transferencia)'
    contains: [["no tengo", "no cuento", "persona", "administracion", "codigo"]]

