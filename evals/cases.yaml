# Bot evaluation cases. All data is invented (see evals/seed.py).
#
# phone:   alias from evals/seed.py PHONES.
# now:     optional Córdoba local time (default: Thursday 01/10/2026 11:00, office hours).
# settings: optional Settings overrides for the case (e.g. emergency_contact_text).
# turns:   1 to 4 user messages. "{code}" = last verification code emailed in the case,
#          "{wrong_code}" = a code that was not sent. A turn can be {text, before}, where
#          before: expire_codes makes the pending codes expire before that message.
# expect:
#   must_call / must_not_call: tool names.
#   must_return: {tool: status}: some call of that tool returned that status.
#   must_not_return: {tool: status}: no call of that tool returned that status.
#   handoff: true / false (omitted = either).   handoff_priority: normal | urgent.
#   contains / not_contains: text in ANY bot reply (case and accents ignored, "*" removed).
#            A nested list in `contains` means "at least one of these".
#   not_matches: regular expressions that must not match (same normalized text).
#   contains / not_contains / not_matches look at everything sent: the debt messages built
#            by the code and the agent's text.
#   debt_message_contains: text in the debt messages built by the code (same rules).
#   debt_messages: how many debt messages the whole case sends.
#   choices: true / false: whether some reply offered options to tap (offer_choices).
#   choices_contain: titles among the options offered (same rules as contains).
#   reply_not_contains: text that must not be in the agent's own text (not the debt messages).
#   A turn that "taps" an option is written as its title (that is what WhatsApp delivers).
#   Always checked: once a debt message went out, the agent's text has no "$" amount that is
#   not in one of them.
#
# Reference values: Rodas II 04-C (Ana) $165.060,00 code 1111222233334444001 ·
# Rodas II 04-B (Bruno) $48.500,00 code ...002 · Torre del Sol COC.3 (Bruno) $12.300,00
# code ...003 · Torre del Sol 05-A (Carla) $87.250,50 no code · Torre del Sol 05-B (Fede)
# $0 code ...005 · Rodas II 01-A (Diego, no phone) $230.400,00 code ...004 ·
# Los Algarrobos 02-A (Elena, no email) $95.000,00 · Rodas I 02-B (Gustavo, studio email
# only) $61.200,00 · Rodas I 04-C (Hugo) $70.400,00. Tito is TENANT of Rodas II 04-C.

# --- Deuda y código de pago ----------------------------------------------------------------

- id: deuda_simple
  category: deuda
  phone: ana
  turns: ["¿Cuánto debo de expensas?"]
  expect:
    debt_messages: 1
    # First message: the fixed greeting goes before the block and the agent does not repeat it.
    debt_message_contains: ["hola, soy el asistente automatico del estudio diego rufeil", "rodas ii 04-c", "saldo total: $165.060,00", "codigo de pago siro: 1111222233334444001", "dato al 30/09/2026"]
    reply_not_contains: ["asistente automatico", "soy el asistente"]
    must_call: [get_debt]
    handoff: false
    contains: ["165.060", "1111222233334444001"]

- id: deuda_codigo_pago
  category: deuda
  phone: ana
  turns: ["Pasame el código para pagar las expensas"]
  expect:
    debt_messages: 1
    debt_message_contains: ["codigo de pago siro: 1111222233334444001", "pago mis cuentas"]
    must_call: [get_payment_info]
    must_not_call: [get_debt]
    handoff: false
    contains: ["1111222233334444001"]
    not_contains: ["165.060", "saldo"]

- id: como_pago_sin_deuda
  category: deuda
  phone: ana
  turns: ["¿Cómo pago las expensas?"]
  settings: {autogestion_url: "https://autogestion.example.com"}
  expect:
    debt_messages: 1
    debt_message_contains: ["codigo de pago siro: 1111222233334444001", "https://autogestion.example.com"]
    must_call: [get_payment_info]
    must_not_call: [get_debt]
    not_contains: ["165.060", "82.530"]

- id: deuda_con_link_autogestion
  category: deuda
  phone: ana
  turns: ["¿Cuánto debo?"]
  settings: {autogestion_url: "https://autogestion.example.com"}
  expect:
    debt_messages: 1
    debt_message_contains: ["165.060", "expensas y comprobantes: https://autogestion.example.com"]
    must_call: [get_debt]
    # The link goes only in the block built by the code.
    reply_not_contains: ["http", "www."]

- id: pago_info_desconocido
  category: deuda
  phone: desconocido
  turns: ["¿Cuál es el código de pago del 1A del Rodas II?"]
  expect:
    debt_messages: 0
    must_not_call: [start_email_verification]
    not_contains: ["1111222233334444004", "230.400"]

- id: deuda_tras_saludo
  category: deuda
  phone: ana
  turns: ["Hola, buenas", "quiero saber mi deuda"]
  expect:
    debt_messages: 1
    debt_message_contains: ["165.060"]
    must_call: [get_debt]
    handoff: false
    contains: [["automatico", "virtual"], "165.060"]

- id: deuda_y_como_pagar
  category: deuda
  phone: ana
  turns: ["¿Cuánto debo y cómo lo pago?"]
  expect:
    debt_messages: 1
    debt_message_contains: ["165.060", "pago mis cuentas"]
    must_call: [get_debt]
    contains: ["165.060", "pago mis cuentas"]

- id: deuda_fecha_del_dato
  category: deuda
  phone: ana
  turns: ["¿Cuánto tengo pendiente? ¿de qué fecha es el dato?"]
  expect:
    debt_messages: 1
    debt_message_contains: ["dato al 30/09/2026"]
    must_call: [get_debt]
    contains: ["165.060", "30/09/2026"]

- id: deuda_al_dia
  category: deuda
  phone: fede
  turns: ["¿Tengo alguna deuda?"]
  expect:
    debt_messages: 1
    debt_message_contains: ["estas al dia"]
    must_call: [get_debt]
    handoff: false
    contains: [["al dia", "no tenes deuda", "no registra", "$0,00", "no tenes saldo", "sin deuda"]]

- id: deuda_detalle_periodos
